<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Pi Studio</title>
    <script>
      // 在首次绘制前定好主题/配色，避免闪白/闪黑
      // 支持 ?theme=dark&accent=mint 临时指定（不会写入本地设置）
      // 以及截图模式 ?shot=dark.mint（同时关闭 SSE 长连接）
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          var shot = params.get("shot");
          var qTheme = params.get("theme");
          var qAccent = params.get("accent");
          if (shot) {
            var parts = shot.split(".");
            qTheme = qTheme || parts[0] || "";
            qAccent = qAccent || parts[1] || "";
          }
          if (shot || qTheme || qAccent) window.__appearanceFromUrl = true;
          var t = qTheme || localStorage.getItem("piStudioTheme");
          var a = qAccent || localStorage.getItem("piStudioAccent");
          document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
          document.documentElement.setAttribute("data-accent", a || "violet");
          var w = localStorage.getItem("piStudioSidebarW");
          if (w) document.documentElement.style.setProperty("--sidebar-w", w + "px");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.setAttribute("data-accent", "violet");
        }
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b7dff'/%3E%3Cstop offset='1' stop-color='%2343e0ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M50 6l9 30 30 9-30 9-9 30-9-30-30-9 30-9z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- animated background -->
    <div class="aurora" aria-hidden="true">
      <span class="blob b1"></span>
      <span class="blob b2"></span>
      <span class="blob b3"></span>
      <span class="grain"></span>
    </div>

    <div id="app" class="app">
      <!-- ======================= SIDEBAR ======================= -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-head">
          <div class="brand" id="brandBtn" title="回到首页">
            <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
              <defs>
                <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#8b7dff" />
                  <stop offset="1" stop-color="#43e0ff" />
                </linearGradient>
              </defs>
              <path d="M50 6l9 30 30 9-30 9-9 30-9-30-30-9 30-9z" fill="url(#bg1)" />
            </svg>
            <span class="brand-name">Pi&nbsp;Studio</span>
          </div>
          <button class="icon-btn" id="themeBtn" title="切换浅色 / 深色主题"></button>
          <button class="icon-btn" id="collapseBtn" title="收起侧栏 (Ctrl+B)">
            <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg>
          </button>
        </div>

        <button class="btn btn-primary btn-block" id="newProjectBtn">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
          <span>新建项目</span>
        </button>

        <button class="btn btn-block search-trigger" id="searchBtn" title="搜索所有历史对话 (Ctrl+Shift+F)">
          <svg viewBox="0 0 24 24"><path d="M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4.3-4.3" /></svg>
          <span>搜索历史对话</span>
        </button>

        <div class="sidebar-scroll" id="projectList"></div>

        <div class="sidebar-foot">
          <button class="ghost-row" id="workspaceBtn" title="打开工作区根目录">
            <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" /></svg>
            <span class="foot-label" id="workspaceLabel">工作区</span>
          </button>
          <button class="ghost-row" id="paletteBtn" title="命令面板 (Ctrl+K)">
            <svg viewBox="0 0 24 24"><path d="M11 19a8 8 0 116-13.3L21 2m-4 14l5 5" /></svg>
            <span class="foot-label">命令面板</span>
            <kbd>Ctrl K</kbd>
          </button>
        </div>

        <div class="sidebar-resizer" id="sidebarResizer" title="拖动调整侧栏宽度（双击复位）"></div>
      </aside>

      <!-- ======================= MAIN ======================= -->
      <main class="main">
        <header class="topbar">
          <button class="icon-btn only-collapsed" id="expandBtn" title="展开侧栏 (Ctrl+B)">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
          <div class="crumb" id="crumb"></div>
          <div class="topbar-right" id="topbarRight"></div>
        </header>

        <div id="findBar" class="findbar" hidden>
          <svg viewBox="0 0 24 24" class="fb-ico"><path d="M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4.3-4.3" /></svg>
          <input id="findInput" type="text" placeholder="在本对话中查找…" autocomplete="off" />
          <span class="find-count" id="findCount">0/0</span>
          <button class="icon-btn" id="findPrev" title="上一个 (Shift+Enter)">
            <svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6" /></svg>
          </button>
          <button class="icon-btn" id="findNext" title="下一个 (Enter)">
            <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
          </button>
          <button class="icon-btn" id="findClose" title="关闭 (Esc)">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>

        <section class="stage" id="stage">
          <!-- filled by JS: welcome / project home / chat -->
        </section>

        <footer class="composer-wrap" id="composerWrap"></footer>
      </main>
    </div>

    <div id="modalRoot"></div>
    <div id="toasts" class="toasts"></div>
    <div id="slashMenu" class="slash-menu" hidden></div>
    <div id="ctxMenu" class="ctx-menu" hidden></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
